<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>外刊精读</title>
<style>
  :root {
    --bg:#f5f5f3; --card:#fff; --text:#1f2328; --muted:#57606a;
    --hint:#8b949e; --line:#e8e6e0; --accent:#185fa5; --good:#0f6e56;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:0 0 env(safe-area-inset-bottom);
  }
  header {
    position:sticky; top:0; z-index:9; background:rgba(245,245,243,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 18px 10px;
  }
  header > * { max-width:560px; margin-left:auto; margin-right:auto; }
  h1 { font-size:19px; margin:0; font-weight:600; }
  .sub { font-size:12px; color:var(--hint); margin-top:3px; }
  nav { display:flex; gap:8px; margin-top:12px; }
  nav button {
    flex:1; border:0; background:var(--card); color:var(--muted);
    font-size:13px; padding:9px 0; border-radius:9px; font-family:inherit;
  }
  nav button.on { background:var(--accent); color:#fff; }
  main { padding:16px 18px 60px; max-width:560px; margin:0 auto; }
  .item {
    background:var(--card); border-radius:14px; padding:15px 16px 12px;
    margin-bottom:12px;
  }
  .row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .date { font-size:11.5px; color:var(--hint); }
  .tag { font-size:10.5px; color:var(--muted); background:#f1efe8; padding:2px 7px; border-radius:5px; }
  .tag.v { color:var(--good); background:#e1f5ee; }
  .t { font-size:16.5px; font-weight:500; margin-top:8px; line-height:1.45; }
  .s {
    font-size:13px; color:var(--muted); line-height:1.65; margin-top:7px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
  }
  .dot { display:flex; gap:6px; margin-top:11px; }
  .dot i { width:24px; height:3px; background:var(--line); border-radius:2px; }
  .dot i.f { background:var(--accent); }
  .empty { text-align:center; color:var(--hint); font-size:14px; padding:60px 20px; line-height:1.8; }
  .card {
    background:var(--card); border-radius:14px; padding:18px 17px;
    margin-bottom:12px;
  }
  .w { font-size:27px; font-weight:600; }
  .ph { font-size:13px; color:var(--muted); margin-top:3px; }
  .mean { font-size:16px; margin-top:6px; }
  .stats { display:flex; gap:9px; margin-bottom:14px; }
  .stats div { flex:1; background:var(--card); border-radius:12px; padding:13px 0; text-align:center; }
  .stats b { display:block; font-size:20px; color:var(--accent); font-weight:500; }
  .stats span { font-size:11px; color:var(--hint); }
  .acts { display:flex; gap:9px; margin-top:14px; }
  .acts button {
    flex:1; border:0; border-radius:12px; padding:13px 0; font-size:14px;
    font-family:inherit; background:var(--card); font-weight:500;
  }
  .a0 { color:#a32d2d; } .a1 { color:#854f0b; } .a2 { color:#0f6e56; }
  .tabs { display:flex; gap:6px; margin:16px 0 12px; }
  .tabs button {
    flex:1; border:0; background:var(--card); color:var(--muted);
    font-size:12.5px; padding:9px 0; border-radius:9px; font-family:inherit;
  }
  .tabs button.on { background:var(--accent); color:#fff; }
  .ex-en { font-size:13.5px; color:var(--muted); margin-top:10px; line-height:1.65; }
  .ex-zh { font-size:13px; color:var(--hint); margin-top:4px; line-height:1.65; }
  .seg-en { font-size:14.5px; color:#24292f; line-height:1.75; }
  .seg-zh { font-size:14.5px; margin-top:9px; padding-top:9px; border-top:1px solid #f0eee8; line-height:1.75; }
  .gsen { font-size:14.5px; font-weight:500; line-height:1.7; }
  .gp { font-size:12.5px; color:var(--accent); margin-top:8px; }
  .ge { font-size:13.5px; color:var(--muted); line-height:1.75; margin-top:6px; }
  a.back { font-size:13px; color:var(--accent); display:inline-block; margin-bottom:10px; text-decoration:none; }
  .meta { font-size:12px; color:var(--hint); margin-top:6px; }
  .sum { background:#f7f6f2; border-radius:11px; padding:13px 14px; font-size:13.5px; line-height:1.75; margin-top:13px; }
  .qa { font-size:14.5px; line-height:1.7; }
  .an { font-size:13.5px; color:var(--good); margin-top:10px; padding-top:9px; border-top:1px solid #f0eee8; line-height:1.7; }
  .qtap { font-size:12.5px; color:var(--hint); margin-top:8px; }
  .hint { text-align:center; color:var(--hint); font-size:14px; padding:50px 20px; }
</style>
</head>
<body>
<header>
  <h1>外刊精读</h1>
  <div class="sub" id="sub">每天一篇，读原文，也读世界</div>
  <nav>
    <button id="navList" class="on">每日精读</button>
    <button id="navReview">复习单词</button>
  </nav>
</header>
<main id="main"><div class="hint">正在加载…</div></main>

<script>
const $ = (s) => document.querySelector(s);
const S = { items: [], vocab: [], view: "list", queue: [], qi: 0, flipped: false,
            detail: null, tab: "vocab", answers: {} };

const PROG = "wb_progress_v2";
const loadProg = () => { try { return JSON.parse(localStorage.getItem(PROG)) || {}; } catch (e) { return {}; } };
const saveProg = (o) => { try { localStorage.setItem(PROG, JSON.stringify(o)); } catch (e) {} };
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function boot() {
  try {
    const [idx, voc] = await Promise.all([
      fetch("index.json").then((r) => r.json()).catch(() => ({ items: [] })),
      fetch("vocab.json").then((r) => r.json()).catch(() => ({ vocab: [] })),
    ]);
    S.items = idx.items || [];
    S.vocab = voc.vocab || [];
    $("#sub").textContent = `${S.items.length} 篇精读 · ${S.vocab.length} 个生词`;
  } catch (e) {}
  if (!applyHash()) render();
}

function stats() {
  const p = loadProg(), ks = Object.keys(p), t = today();
  return {
    learned: ks.filter((k) => p[k].seen > 0).length,
    due: ks.filter((k) => p[k].next <= t).length,
    mastered: ks.filter((k) => p[k].interval >= 21).length,
  };
}

function buildQueue() {
  const p = loadProg(), t = today(), due = [], fresh = [];
  S.vocab.forEach((v) => {
    const k = (v.word || "").toLowerCase(); if (!k) return;
    const st = p[k];
    if (!st) fresh.push({ ...v, _k: k });
    else if (st.next <= t) due.push({ ...v, _k: k });
  });
  return due.concat(fresh);
}

function grade(k, v, g) {
  const all = loadProg();
  const st = all[k] || { seen: 0, interval: 0, ease: 2.5 };
  if (g === 0) { st.interval = 1; st.ease = Math.max(1.3, st.ease - 0.2); }
  else if (g === 1) { st.interval = Math.max(1, st.interval); }
  else { st.interval = st.interval <= 0 ? 1 : Math.round(st.interval * st.ease); st.ease = Math.min(3, st.ease + 0.05); }
  st.seen = (st.seen || 0) + 1;
  st.next = addDays(st.interval);
  all[k] = st; saveProg(all);
}

function render() {
  $("#navList").classList.toggle("on", S.view !== "review");
  $("#navReview").classList.toggle("on", S.view === "review");
  if (S.view === "list") return renderList();
  if (S.view === "review") return renderReview();
  if (S.view === "detail") return renderDetail();
}

function renderList() {
  const st = stats();
  if (!S.items.length) {
    $("#main").innerHTML = `<div class="empty">还没有精读内容。<br>先让每日任务跑一次，或者检查 Pages 是否已发布。</div>`;
    return;
  }
  $("#main").innerHTML =
    `<div class="stats">
       <div><b>${st.learned}</b><span>已学单词</span></div>
       <div><b>${st.due}</b><span>今日待复习</span></div>
       <div><b>${st.mastered}</b><span>已掌握</span></div>
     </div>` +
    S.items.map((it, i) => `
      <div class="item" data-i="${i}">
        <div class="row">
          <span class="date">${esc(it.date)}</span>
          ${it.level ? `<span class="tag">${esc(it.level)}</span>` : ""}
          ${it.word_count ? `<span class="tag">${it.word_count} 词</span>` : ""}
          ${it.vocab && it.vocab.length ? `<span class="tag v">${it.vocab.length} 生词</span>` : ""}
        </div>
        <div class="t">${esc(it.title_zh)}</div>
        ${it.summary ? `<div class="s">${esc(it.summary)}</div>` : ""}
      </div>`).join("");
  $("#main").querySelectorAll(".item").forEach((el) => {
    const it = S.items[+el.dataset.i];
    el.onclick = () => {
      const h = "detail=" + it.id;
      if (location.hash === "#" + h) openDetail(it); else location.hash = h;
    };
  });
}

async function openDetail(it) {
  S.view = "detail"; S.tab = "vocab"; S.answers = {};
  const res = await fetch(`daily/${it.date}-${it.id}.json`).then((r) => r.json()).catch(() => null);
  S.detail = res || it;
  renderDetail();
}

function renderDetail() {
  const d = S.detail; if (!d) return;
  const v = d.vocab || [], tr = d.translation || [], gr = d.grammar || [], qs = d.questions || [];
  let body = "";
  if (S.tab === "vocab") {
    body = v.map((x) => `
      <div class="card">
        <div class="w">${esc(x.word)}</div>
        <div class="ph">${esc(x.pos || "")} ${esc(x.phonetic || "")}</div>
        <div class="mean">${esc(x.meaning_zh)}</div>
        ${x.example_en ? `<div class="ex-en">${esc(x.example_en)}</div>` : ""}
        ${x.example_zh ? `<div class="ex-zh">${esc(x.example_zh)}</div>` : ""}
      </div>`).join("") || `<div class="hint">这篇没有生词数据</div>`;
  } else if (S.tab === "trans") {
    body = tr.map((x) => `
      <div class="card">
        <div class="seg-en">${esc(x.en)}</div>
        <div class="seg-zh">${esc(x.zh)}</div>
      </div>`).join("") || `<div class="hint">没有翻译数据</div>`;
  } else if (S.tab === "gram") {
    body = gr.map((x) => `
      <div class="card">
        <div class="gsen">${esc(x.sentence)}</div>
        ${x.point ? `<div class="gp">结构：${esc(x.point)}</div>` : ""}
        <div class="ge">${esc(x.explain_zh)}</div>
      </div>`).join("") || `<div class="hint">没有长难句数据</div>`;
  } else {
    body = qs.map((x, i) => `
      <div class="card" data-q="${i}">
        <div class="qa">${i + 1}. ${esc(x.q)}</div>
        ${S.answers[i] ? `<div class="an">参考答案：${esc(x.a)}</div>` : `<div class="qtap">点击查看答案</div>`}
      </div>`).join("") || `<div class="hint">没有理解题</div>`;
  }

  $("#main").innerHTML = `
    <a class="back" id="back">← 返回列表</a>
    <div class="card">
      <div class="t" style="margin:0">${esc(d.title_zh || "")}</div>
      <div class="meta">${esc(d.source || "")}${d.level ? " · " + esc(d.level) : ""}${d.word_count ? " · " + d.word_count + " 词" : ""}</div>
      ${d.summary ? `<div class="sum">${esc(d.summary)}</div>` : ""}
      ${d.url ? `<div style="margin-top:12px"><a href="${esc(d.url)}" target="_blank" style="font-size:13px;color:var(--accent)">查看原文 →</a></div>` : ""}
    </div>
    <div class="tabs">
      <button data-t="vocab" class="${S.tab === "vocab" ? "on" : ""}">生词 ${v.length}</button>
      <button data-t="trans" class="${S.tab === "trans" ? "on" : ""}">翻译</button>
      <button data-t="gram" class="${S.tab === "gram" ? "on" : ""}">长难句</button>
      <button data-t="quiz" class="${S.tab === "quiz" ? "on" : ""}">理解题</button>
    </div>
    <div id="body">${body}</div>`;

  $("#back").onclick = () => { location.hash = ""; };
  $("#main").querySelectorAll(".tabs button").forEach((b) =>
    b.onclick = () => { S.tab = b.dataset.t; renderDetail(); });
  $("#main").querySelectorAll("[data-q]").forEach((el) =>
    el.onclick = () => { S.answers[el.dataset.q] = true; renderDetail(); });
}

function renderReview() {
  const st = stats();

  if (!S.queue.length) S.queue = buildQueue();

  if (!S.queue.length) {
    $("#main").innerHTML = `
      <div class="stats">
        <div><b>${st.learned}</b><span>已学</span></div>
        <div><b>${st.due}</b><span>待复习</span></div>
        <div><b>${st.mastered}</b><span>已掌握</span></div>
      </div>
      <div class="empty">词库是空的。<br>先跑一次每日任务生成生词。</div>`;
    return;
  }

  const cur = S.queue[S.qi];
  if (!cur) {
    $("#main").innerHTML = `
      <div class="empty">
        <div style="font-size:17px;color:var(--text);font-weight:500;margin-bottom:8px">今天的复习完成了</div>
        共复习 ${S.queue.length} 个词
      </div>
      <div class="stats">
        <div><b>${st.learned}</b><span>已学</span></div>
        <div><b>${st.due}</b><span>待复习</span></div>
        <div><b>${st.mastered}</b><span>已掌握</span></div>
      </div>
      <div class="acts"><button class="a2" id="again">再学一轮</button></div>`;
    $("#again").onclick = () => { S.queue = buildQueue(); S.qi = 0; S.flipped = false; renderReview(); };
    return;
  }

  const total = S.queue.length;
  $("#main").innerHTML = `
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${S.qi + 1} / ${total}</div>
    <div class="dot" style="margin:0 0 14px">${
      Array.from({ length: Math.min(total, 24) }, (_, i) =>
        `<i class="${i < S.qi * 24 / total ? "f" : ""}"></i>`).join("")}</div>
    <div class="card" id="card" style="text-align:center;padding:44px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:center">
      <div class="w">${esc(cur.word)}</div>
      ${cur.phonetic ? `<div class="ph">${esc(cur.phonetic)}</div>` : ""}
      ${cur.pos ? `<div class="ph">${esc(cur.pos)}</div>` : ""}
      ${S.flipped ? `
        <div style="width:38px;height:1px;background:var(--line);margin:18px auto"></div>
        <div class="mean">${esc(cur.meaning_zh)}</div>
        ${cur.example_en ? `<div class="ex-en" style="text-align:left">${esc(cur.example_en)}</div>` : ""}
        ${cur.example_zh ? `<div class="ex-zh" style="text-align:left">${esc(cur.example_zh)}</div>` : ""}
      ` : `<div style="font-size:12.5px;color:var(--hint);margin-top:30px">点击卡片查看释义</div>`}
    </div>
    ${S.flipped ? `
      <div class="acts">
        <button class="a0" data-g="0">不认识</button>
        <button class="a1" data-g="1">模糊</button>
        <button class="a2" data-g="2">认识</button>
      </div>` : `<div class="acts"><button id="flip">查看释义</button></div>`}`;

  $("#card").onclick = () => { S.flipped = !S.flipped; renderReview(); };
  const flip = $("#flip");
  if (flip) flip.onclick = (e) => { e.stopPropagation(); S.flipped = true; renderReview(); };
  $("#main").querySelectorAll("[data-g]").forEach((b) =>
    b.onclick = (e) => {
      e.stopPropagation();
      grade(cur._k, cur, +b.dataset.g);
      S.qi++; S.flipped = false; renderReview();
    });
}

function applyHash() {
  const h = location.hash || "";
  if (h === "#review") {
    if (S.view !== "review") { S.queue = buildQueue(); S.qi = 0; S.flipped = false; }
    S.view = "review"; render(); return true;
  }
  if (h.indexOf("#detail=") === 0) {
    const id = decodeURIComponent(h.slice(8));
    const it = S.items.find((x) => x.id === id);
    if (it) { openDetail(it); return true; }
  }
  if (S.view !== "list") { S.view = "list"; render(); return true; }
  return false;
}

$("#navList").onclick = () => { location.hash = ""; };
$("#navReview").onclick = () => { location.hash = "review"; };
window.addEventListener("hashchange", applyHash);
boot();
</script>
</body>
</html>
