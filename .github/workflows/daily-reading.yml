name: 每日外刊精读

# 定时触发：UTC 23:00 = 北京时间次日 07:00
# 注意 GitHub 的 cron 用的是 UTC，不是北京时间
on:
  schedule:
    - cron: "0 23 * * *"
  # 也允许手动点按钮触发，方便测试
  workflow_dispatch:
    inputs:
      count:
        description: "今天精读几篇"
        required: false
        default: "1"
      no_email:
        description: "只归档不发邮件（填 true / false）"
        required: false
        default: "false"
      url:
        description: "指定文章链接（留空则自动挑选）"
        required: false
        default: ""

# 需要写回仓库（归档 Markdown 和去重记录），所以要有写权限
permissions:
  contents: write

# 避免两次任务叠在一起跑
concurrency:
  group: daily-reading
  cancel-in-progress: false

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 自检：不联网、不调用大模型，先确认渲染链路是通的
      - name: 环境自检
        run: python main.py --selftest

      # 一眼看出哪个 Secret 忘了填（只打印是否配置，不打印值）
      - name: 推送通道体检
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          CUSTOM_WEBHOOK: ${{ secrets.CUSTOM_WEBHOOK }}
        run: |
          for v in LLM_API_KEY SMTP_SENDER SMTP_PASSWORD SMTP_RECEIVER \
                   SERVERCHAN_KEY WECOM_WEBHOOK DINGTALK_WEBHOOK DINGTALK_SECRET CUSTOM_WEBHOOK; do
            eval "val=\$$v"
            if [ -n "$val" ]; then echo "✅ $v 已配置"; else echo "⬜ $v 未配置"; fi
          done

      - name: 生成今日精读
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 选配：想在 Secrets 里临时换模型/换服务商，填这两个即可覆盖 config.yaml
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          CUSTOM_WEBHOOK: ${{ secrets.CUSTOM_WEBHOOK }}
        run: |
          # 没配 Key 就直接红，别再"优雅跳过"把失败藏起来
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error title=缺少 LLM_API_KEY::未配置大模型 API Key，本次未生成任何内容。请到 Settings → Secrets and variables → Actions 添加 LLM_API_KEY 后重新运行。"
            exit 1
          fi
          # 用数组拼参数，避免 URL 里的 & ? 被 shell 解释
          ARGS=()
          COUNT="${{ github.event.inputs.count }}"
          NO_EMAIL="${{ github.event.inputs.no_email }}"
          URL="${{ github.event.inputs.url }}"
          if [ -n "$COUNT" ]; then ARGS+=(--count "$COUNT"); fi
          if [ "$NO_EMAIL" = "true" ]; then ARGS+=(--no-email); fi
          if [ -n "$URL" ]; then ARGS+=(--url "$URL"); fi
          echo "运行参数：${ARGS[*]}"
          python main.py "${ARGS[@]}"

      # 兜底：必须确认【本次】真的产出了文件。
      # 原来只看"今天有没有 md"，早上已经成功过的话，后面这次失败也会被掩盖成成功。
      - name: 校验本次确有产出
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          NEW=$(git status --porcelain --untracked-files=all output/ | grep -c '\.md$' || true)
          if [ "$NEW" -gt 0 ]; then
            echo "本次新增 $NEW 篇："
            ls -lh output/${TODAY:0:7}/${TODAY}-* 2>/dev/null || ls -lh output/
          else
            echo "::error title=本次无产出::本次运行没有生成任何新归档，生成环节失败了（看上一段日志，多半是选到的文章模型解析不出来）"
            exit 1
          fi

      - name: 归档回提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state docs
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "外刊精读 $(date -u +%F)"
            git push
          fi

      # docs/ 是给小程序和网页读的静态 JSON + 页面，用 Pages 托管。
      # 这一步是可选的：没在 Settings → Pages 里把 Source 选成 GitHub Actions
      # 就会失败，但用 continue-on-error 兜住，不影响每天的精读归档和推送。
      - name: 发布到 GitHub Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: reading
    # 同上：Pages 没配好时这一步会跳过，不把整个定时任务标成失败
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
